<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kinza Shop - Admin Panel</title>
    <link rel="stylesheet" href="style.css">

    <!-- Firebase SDKs (Compat Versions) -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
</head>
<body>

    <div id="loginBox" class="box" style="margin: 50px auto; max-width: 350px;">
        <h2 style="text-align: center; margin-bottom: 15px;">অ্যাডমিন লগইন</h2>
        <input type="text" id="adminUser" placeholder="ইউজারনেম">
        <input type="password" id="adminPass" placeholder="পাসওয়ার্ড">
        <button class="btn" onclick="login()">লগইন করুন</button>
        <p id="errMsg" style="color:red; font-size:12px; margin-top:5px; text-align:center;"></p>
    </div>

    <div id="adminPanel" style="display: none; padding: 15px; max-width: 600px; margin: auto;">
        <div style="display: flex; justify-content: space-between; align-items: center;">
            <h2>KINZA SHOP অ্যাডমিন</h2>
            <button class="btn" style="width: auto; background: #333;" onclick="logout()">লগআউট</button>
        </div>

        <hr style="margin: 15px 0;">

        <h3>🖼️ স্লাইডার ব্যানার ম্যানেজ করুন</h3>
        <div class="box" style="margin-top: 10px;">
            <label style="font-size: 12px; font-weight: bold;">ব্যানার ছবি বাছুন:</label>
            <input type="file" id="bImg" accept="image/*">
            <button class="btn" id="bSaveBtn" onclick="addBanner()">ব্যানার সেভ করুন</button>
        </div>
        <div id="bannerList" style="margin-top: 10px;"></div>

        <hr style="margin: 20px 0;">

        <h3>📦 নতুন পণ্য যোগ করুন</h3>
        <div class="box" style="margin-top: 10px;">
            <input type="text" id="pTitle" placeholder="পণ্যের নাম">
            <input type="number" id="pPrice" placeholder="বর্তমান দাম (৳)">
            <input type="number" id="pOldPrice" placeholder="আগের দাম (৳)">
            <input type="number" step="0.1" id="pRating" placeholder="রেটিং (যেমন: 4.9)">
            
            <label style="font-size: 12px; font-weight: bold;">গ্যালারি থেকে ছবি বেছে নিন:</label>
            <input type="file" id="pImg" accept="image/*">
            
            <select id="pCat" style="width:100%; padding:10px; margin:6px 0; border:1px solid #ddd; border-radius:6px;">
                <option value="Clothing">Clothing</option>
                <option value="Girlsclothes">Girls</option>
                <option value="Watch">Watch</option>
                <option value="Electronics">Electronics</option>
            </select>

            <button class="btn" id="pSaveBtn" onclick="addProduct()">পণ্য পাবলিশ করুন</button>
        </div>

        <hr style="margin: 20px 0;">
        <h3>বর্তমান পণ্যসমূহ</h3>
        <div id="productList" style="margin-top: 10px;"></div>

        <hr style="margin: 20px 0;">
        <h3>🛒 অর্ডারের তালিকা</h3>
        <div id="orderList" style="margin-top: 10px;"></div>
    </div>

    <script>
        // Firebase Config Setup
        const firebaseConfig = {
            apiKey: "AIzaSyDyXPTMCYmKlRlDPY__RWb25H2sg7sSh8o",
            authDomain: "kinza-shop.firebaseapp.com",
            projectId: "kinza-shop",
            storageBucket: "kinza-shop.firebasestorage.app",
            messagingSenderId: "379851505630",
            appId: "1:379851505630:web:84343983ab0f8f4883274f",
            measurementId: "G-8YGK45QM6M"
        };

        // Initialize Firebase
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        const USERNAME = "admin";
        const PASSWORD = "kinza123";

        function login() {
            if(document.getElementById('adminUser').value === USERNAME && document.getElementById('adminPass').value === PASSWORD) {
                localStorage.setItem('kinzaAdminLogged', 'true');
                showPanel();
            } else {
                document.getElementById('errMsg').innerText = "ভুল ইউজারনেম বা পাসওয়ার্ড!";
            }
        }

        function logout() {
            localStorage.removeItem('kinzaAdminLogged');
            location.reload();
        }

        function showPanel() {
            document.getElementById('loginBox').style.display = 'none';
            document.getElementById('adminPanel').style.display = 'block';
            listenToFirebaseData();
        }

        if(localStorage.getItem('kinzaAdminLogged') === 'true') showPanel();

        // ছবির সাইজ ছোট (WebP কম্প্রেস) করার ফাংশন
        function processImage(file) {
            return new Promise((resolve) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = (e) => {
                    const img = new Image();
                    img.src = e.target.result;
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        const MAX_WIDTH = 600;
                        let w = img.width, h = img.height;
                        if (w > MAX_WIDTH) { h = Math.round((h * MAX_WIDTH) / w); w = MAX_WIDTH; }
                        canvas.width = w; canvas.height = h;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, w, h);
                        resolve(canvas.toDataURL('image/webp', 0.7));
                    };
                };
            });
        }

        // ফায়ারবেসে ব্যানার যোগ করা
        async function addBanner() {
            const file = document.getElementById('bImg').files[0];
            if(!file) return alert('ছবি সিলেক্ট করুন!');
            
            const btn = document.getElementById('bSaveBtn');
            btn.disabled = true;
            btn.innerText = "আপলোড হচ্ছে...";

            try {
                const webpImg = await processImage(file);
                await db.collection('banners').add({
                    img: webpImg,
                    createdAt: firebase.firestore.FieldValue.serverTimestamp()
                });
                alert('ব্যানার সফলভাবে ফায়ারবেসে সেভ হয়েছে!');
                document.getElementById('bImg').value = '';
            } catch(e) {
                alert('ত্রুটি: ' + e.message);
            } finally {
                btn.disabled = false;
                btn.innerText = "ব্যানার সেভ করুন";
            }
        }

        // ফায়ারবেসে প্রোডাক্ট যোগ করা
        async function addProduct() {
            const title = document.getElementById('pTitle').value;
            const price = document.getElementById('pPrice').value;
            const oldPrice = document.getElementById('pOldPrice').value;
            const rating = document.getElementById('pRating').value || "4.9";
            const cat = document.getElementById('pCat').value;
            const file = document.getElementById('pImg').files[0];

            if(!title || !price || !file) return alert('পণ্যের নাম, দাম ও ছবি দিন!');

            const btn = document.getElementById('pSaveBtn');
            btn.disabled = true;
            btn.innerText = "পাবলিশ হচ্ছে...";

            try {
                const webpImg = await processImage(file);
                await db.collection('products').add({
                    title,
                    price: Number(price),
                    oldPrice: oldPrice ? Number(oldPrice) : "",
                    rating,
                    category: cat,
                    img: webpImg,
                    createdAt: firebase.firestore.FieldValue.serverTimestamp()
                });

                alert('পণ্য সফলভাবে ফায়ারবেসে পাবলিশ হয়েছে!');
                document.getElementById('pTitle').value = '';
                document.getElementById('pPrice').value = '';
                document.getElementById('pOldPrice').value = '';
                document.getElementById('pRating').value = '';
                document.getElementById('pImg').value = '';
            } catch(e) {
                alert('ত্রুটি: ' + e.message);
            } finally {
                btn.disabled = false;
                btn.innerText = "পণ্য পাবলিশ করুন";
            }
        }

        // রিয়েলটাইমে ফায়ারবেস থেকে ডাটা শোনা ও দেখানো
        function listenToFirebaseData() {
            // ব্যানার লোড
            db.collection('banners').onSnapshot(snapshot => {
                let bHTML = '';
                snapshot.docs.forEach(doc => {
                    const b = doc.data();
                    bHTML += `<div style="display:flex; justify-content:space-between; align-items:center; background:#fff; padding:8px; margin-bottom:5px; border-radius:6px;">
                        <img src="${b.img}" style="height:40px; width:80px; object-fit:cover;">
                        <button style="background:red; color:#fff; border:none; padding:5px 10px; border-radius:4px; cursor:pointer;" onclick="deleteBanner('${doc.id}')">ডিলিট</button>
                    </div>`;
                });
                document.getElementById('bannerList').innerHTML = bHTML || 'কোনো ব্যানার নেই';
            });

            // প্রোডাক্ট লোড
            db.collection('products').onSnapshot(snapshot => {
                let pHTML = '';
                snapshot.docs.forEach(doc => {
                    const p = doc.data();
                    pHTML += `<div style="background:#fff; padding:10px; margin-bottom:8px; border-radius:6px; display:flex; justify-content:space-between; align-items:center;">
                        <div><b>${p.title}</b><br><span style="color:#e91e63">৳${p.price}</span> <del style="color:#888; font-size:12px">${p.oldPrice ? '৳' + p.oldPrice : ''}</del></div>
                        <button style="background:red; color:#fff; border:none; padding:5px 10px; border-radius:4px; cursor:pointer;" onclick="deleteProduct('${doc.id}')">ডিলিট</button>
                    </div>`;
                });
                document.getElementById('productList').innerHTML = pHTML || 'কোনো পণ্য নেই';
            });

            // অর্ডার লোড
            db.collection('orders').onSnapshot(snapshot => {
                let oHTML = '';
                snapshot.docs.forEach(doc => {
                    const o = doc.data();
                    let itemsSummary = '';
                    if (o.items && o.items.length) {
                        itemsSummary = o.items.map(i => `${i.title} (৳${i.price})`).join(', ');
                    }
                    oHTML += `<div style="background:#fff; padding:10px; margin-bottom:8px; border-radius:6px; border-left:4px solid #e91e63;">
                        <b>নাম:</b> ${o.name} | <b>ফোন:</b> ${o.phone}<br>
                        <b>ঠিকানা:</b> ${o.address}<br>
                        <b>আইটেম:</b> ${itemsSummary || 'N/A'}<br>
                        <b>মোট বিল:</b> ৳${o.totalAmount || 0}<br>
                        <button style="background:red; color:#fff; border:none; padding:4px 8px; border-radius:4px; margin-top:5px; cursor:pointer;" onclick="deleteOrder('${doc.id}')">মুছুন</button>
                    </div>`;
                });
                document.getElementById('orderList').innerHTML = oHTML || 'কোনো অর্ডার নেই';
            });
        }

        // ফায়ারবেস থেকে আইটেম ডিলিট করার ফাংশনসমূহ
        async function deleteBanner(id) {
            if(confirm('ব্যানারটি ডিলিট করতে চান?')) {
                await db.collection('banners').doc(id).delete();
            }
        }

        async function deleteProduct(id) {
            if(confirm('পণ্যটি ডিলিট করতে চান?')) {
                await db.collection('products').doc(id).delete();
            }
        }

        async function deleteOrder(id) {
            if(confirm('অর্ডারটি মুছতে চান?')) {
                await db.collection('orders').doc(id).delete();
            }
        }
    </script>
</body>
</html>
