<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kinza Shop - Admin Panel</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- অ্যাডমিন লগইন বক্স -->
    <div id="loginBox" class="box" style="margin: 50px auto; max-width: 350px;">
        <h2 style="text-align: center; margin-bottom: 15px;">অ্যাডমিন লগইন</h2>
        <input type="text" id="adminUser" placeholder="ইউজারনেম">
        <input type="password" id="adminPass" placeholder="পাসওয়ার্ড">
        <button class="btn" onclick="login()">লগইন করুন</button>
        <p id="errMsg" style="color:red; font-size:12px; margin-top:5px; text-align:center;"></p>
    </div>

    <!-- মূল অ্যাডমিন ড্যাশবোর্ড (লগইনের পর দেখাবে) -->
    <div id="adminPanel" style="display: none; padding: 15px; max-width: 600px; margin: auto;">
        <div style="display: flex; justify-content: space-between; align-items: center;">
            <h2>KINZA SHOP অ্যাডমিন</h2>
            <button class="btn" style="width: auto; background: #333;" onclick="logout()">লগআউট</button>
        </div>

        <hr style="margin: 15px 0;">

        <h3>📦 নতুন প্রোডাক্ট যোগ করুন</h3>
        <div class="box" style="margin-top: 10px;">
            <input type="text" id="pTitle" placeholder="প্রোডাক্টের নাম">
            <input type="number" id="pPrice" placeholder="মূল্য (৳)">
            
            <label style="font-size: 12px; font-weight: bold;">ছবি বেছে নিন (অটো ছোট ও WebP হবে):</label>
            <input type="file" id="pImg" accept="image/*">
            
            <select id="pCat" style="width:100%; padding:10px; margin:6px 0; border:1px solid #ddd; border-radius:6px;">
                <option value="Clothing">Clothing</option>
                <option value="Girlsclothes">Girls</option>
                <option value="Watch">Watch</option>
                <option value="Electronics">Electronics</option>
            </select>

            <button class="btn" onclick="addProduct()">পাবলিশ করুন</button>
        </div>

        <hr style="margin: 20px 0;">

        <h3>📋 প্রোডাক্ট তালিকা</h3>
        <div id="productList" style="margin-top: 10px;"></div>

        <hr style="margin: 20px 0;">

        <h3>🛒 অর্ডারের তালিকা</h3>
        <div id="orderList" style="margin-top: 10px;"></div>
    </div>

    <script>
        // নির্দিষ্ট ইউজারনেম ও পাসওয়ার্ড
        const USERNAME = "admin";
        const PASSWORD = "kinza123";

        function login() {
            const u = document.getElementById('adminUser').value;
            const p = document.getElementById('adminPass').value;
            if(u === USERNAME && p === PASSWORD) {
                localStorage.setItem('kinzaAdminLogged', 'true');
                showPanel();
            } else {
                document.getElementById('errMsg').innerText = "ভুল ইউজারনেম বা পাসওয়ার্ড!";
            }
        }

        function logout() {
            localStorage.removeItem('kinzaAdminLogged');
            location.reload();
        }

        function showPanel() {
            document.getElementById('loginBox').style.display = 'none';
            document.getElementById('adminPanel').style.display = 'block';
            loadAdminData();
        }

        if(localStorage.getItem('kinzaAdminLogged') === 'true') {
            showPanel();
        }

        // ছবি অটো WebP ও ছোট সাইজ করার ফাংশন
        function processImage(file) {
            return new Promise((resolve) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = (e) => {
                    const img = new Image();
                    img.src = e.target.result;
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        const MAX_WIDTH = 400;
                        let w = img.width, h = img.height;
                        if (w > MAX_WIDTH) { h = Math.round((h * MAX_WIDTH) / w); w = MAX_WIDTH; }
                        canvas.width = w; canvas.height = h;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, w, h);
                        resolve(canvas.toDataURL('image/webp', 0.65));
                    };
                };
            });
        }

        async function addProduct() {
            const title = document.getElementById('pTitle').value;
            const price = document.getElementById('pPrice').value;
            const cat = document.getElementById('pCat').value;
            const file = document.getElementById('pImg').files[0];

            if(!title || !price || !file) return alert('সব তথ্য পূরণ করুন!');

            const webpImg = await processImage(file);
            const products = JSON.parse(localStorage.getItem('kinzaProducts') || '[]');
            
            products.push({ id: Date.now(), title, price, category: cat, img: webpImg });
            localStorage.setItem('kinzaProducts', JSON.stringify(products));

            alert('প্রোডাক্ট যুক্ত হয়েছে!');
            location.reload();
        }

        function loadAdminData() {
            // প্রোডাক্ট লোড
            const products = JSON.parse(localStorage.getItem('kinzaProducts') || '[]');
            let pHTML = '';
            products.forEach((p, i) => {
                pHTML += `<div style="display:flex; justify-content:space-between; align-items:center; background:#fff; padding:8px; margin-bottom:5px; border-radius:6px;">
                    <span><b>${p.title}</b> - ৳${p.price}</span>
                    <button style="background:red; color:#fff; border:none; padding:5px 10px; border-radius:4px; cursor:pointer;" onclick="deleteProduct(${i})">ডিলিট</button>
                </div>`;
            });
            document.getElementById('productList').innerHTML = pHTML || 'কোনো প্রোডাক্ট নেই';

            // অর্ডার লোড
            const orders = JSON.parse(localStorage.getItem('kinzaOrders') || '[]');
            let oHTML = '';
            orders.forEach((o, i) => {
                oHTML += `<div style="background:#fff; padding:10px; margin-bottom:8px; border-radius:6px; border-left:4px solid #e91e63;">
                    <b>নাম:</b> ${o.name} | <b>ফোন:</b> ${o.phone}<br>
                    <b>ঠিকানা:</b> ${o.addr}<br>
                    <b>মোট বিল:</b> ৳${o.total}<br>
                    <button style="background:red; color:#fff; border:none; padding:4px 8px; border-radius:4px; margin-top:5px; cursor:pointer;" onclick="deleteOrder(${i})">অর্ডার মুছুন</button>
                </div>`;
            });
            document.getElementById('orderList').innerHTML = oHTML || 'কোনো নতুন অর্ডার নেই';
        }

        function deleteProduct(i) {
            let products = JSON.parse(localStorage.getItem('kinzaProducts') || '[]');
            products.splice(i, 1);
            localStorage.setItem('kinzaProducts', JSON.stringify(products));
            loadAdminData();
        }

        function deleteOrder(i) {
            let orders = JSON.parse(localStorage.getItem('kinzaOrders') || '[]');
            orders.splice(i, 1);
            localStorage.setItem('kinzaOrders', JSON.stringify(orders));
            loadAdminData();
        }
    </script>
</body>
</html>
