<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KINZA SHOP</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="header">
    <div class="top">
        <div class="logo">KINZA SHOP</div>
        <div class="right">
            <div class="cart" id="cartIcon">🛒<span class="cnt" id="cartCnt">0</span></div>
        </div>
    </div>
    <div class="searchWrap">
        <input id="searchInput" placeholder="Search in Kinza Shop...">
        <span>🔍</span>
    </div>
</div>

<div style="background:#fff">
    <img src="https://img.freepik.com/free-vector/gradient-shopping-discount-horizontal-sale-banner_23-2150322012.jpg" style="width:100%;height:160px;object-fit:cover" alt="Banner">
</div>

<div class="cats" id="cats">
    <div class="cat active" data-c="all">All</div>
    <div class="cat" data-c="Clothing">Clothing</div>
    <div class="cat" data-c="Girlsclothes">Girls</div>
    <div class="cat" data-c="Watch">Watch</div>
    <div class="cat" data-c="Electronics">Electronics</div>
</div>

<h3 style="padding:12px 10px 5px; font-size:16px; color:#333;">Just For You</h3>
<div class="grid" id="grid"></div>
<p id="loadTxt" style="text-align:center;padding:20px;color:#888;font-size:14px;">কোনো প্রোডাক্ট পাওয়া যায়নি!</p>

<div class="nav">
    <div onclick="window.scrollTo({top:0, behavior:'smooth'})">🏠 Home</div>
    <div id="bCart">🛒 Cart</div>
</div>

<a class="wa" href="https://wa.me/8801XXXXXXXXX" target="_blank">💬</a>

<!-- প্রোডাক্ট ডিটেইলস মোডাল -->
<div class="modal" id="pModal">
    <div class="box">
        <img id="mImg" style="width:100%;height:220px;object-fit:contain">
        <h3 id="mTitle" style="margin-top:10px;font-size:16px;"></h3>
        <div id="mPrice" class="p" style="font-size:18px;margin:8px 0"></div>
        <button class="btn" id="addCart">Add to Cart</button>
        <button class="btn" style="background:#555" onclick="document.getElementById('pModal').style.display='none'">Close</button>
    </div>
</div>

<!-- কার্ট মোডাল -->
<div class="modal" id="cModal">
    <div class="box">
        <h3>Shopping Cart</h3>
        <div id="cItems" style="margin:12px 0;max-height:200px;overflow-y:auto"></div>
        <h3 id="total" style="text-align:right;margin-bottom:10px;"></h3>
        <button class="btn" id="checkout">Checkout</button>
        <button class="btn" style="background:#555" onclick="document.getElementById('cModal').style.display='none'">Close</button>
    </div>
</div>

<!-- চেকআউট/অর্ডার মোডাল -->
<div class="modal" id="chModal">
    <div class="box">
        <h3>ডেলিভারি তথ্য দিন</h3>
        <input id="cName" placeholder="আপনার নাম">
        <input id="cPhone" placeholder="মোবাইল নম্বর">
        <input id="cAddr" placeholder="পূর্ণাঙ্গ ঠিকানা">
        <button class="btn" id="placeOrder">অর্ডার কনফার্ম করুন</button>
        <button class="btn" style="background:#555" onclick="document.getElementById('chModal').style.display='none'">বাতিল</button>
    </div>
</div>

<script>
    let all = JSON.parse(localStorage.getItem('kinzaProducts') || '[]');
    let cart = JSON.parse(localStorage.getItem('kinzaCart') || '[]');
    let sel = null, cat = 'all', sTxt = '';

    function updCart() {
        document.getElementById('cartCnt').innerText = cart.length;
        localStorage.setItem('kinzaCart', JSON.stringify(cart));
    }
    updCart();

    function render() {
        const grid = document.getElementById('grid');
        grid.innerHTML = '';
        const filtered = all.filter(p => (cat === 'all' || p.category === cat) && p.title.toLowerCase().includes(sTxt.toLowerCase()));
        
        document.getElementById('loadTxt').style.display = filtered.length ? 'none' : 'block';

        filtered.forEach(p => {
            const d = document.createElement('div');
            d.className = 'card';
            d.innerHTML = `<img src="${p.img}" loading="lazy"><div class="t">${p.title}</div><div class="p">৳${p.price}</div>`;
            d.onclick = () => {
                sel = p;
                document.getElementById('mImg').src = p.img;
                document.getElementById('mTitle').innerText = p.title;
                document.getElementById('mPrice').innerText = '৳' + p.price;
                document.getElementById('pModal').style.display = 'flex';
            };
            grid.appendChild(d);
        });
    }
    render();

    document.getElementById('cats').querySelectorAll('.cat').forEach(c => c.onclick = () => {
        document.querySelectorAll('.cat').forEach(x => x.classList.remove('active'));
        c.classList.add('active');
        cat = c.dataset.c;
        render();
    });

    document.getElementById('searchInput').oninput = e => { sTxt = e.target.value; render(); };

    document.getElementById('addCart').onclick = () => {
        cart.push(sel);
        updCart();
        document.getElementById('pModal').style.display = 'none';
        alert('কার্টে যোগ করা হয়েছে!');
    };

    function openCart() {
        document.getElementById('cModal').style.display = 'flex';
        let h = '', t = 0;
        cart.forEach((p, i) => {
            t += Number(p.price);
            h += `<div style="display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid #eee">
                    <span style="font-size:13px">${p.title} (৳${p.price})</span>
                    <span onclick="delCart(${i})" style="color:red;cursor:pointer;font-weight:bold">✕</span>
                  </div>`;
        });
        document.getElementById('cItems').innerHTML = h || '<p style="text-align:center;color:#888">কার্ট খালি</p>';
        document.getElementById('total').innerText = 'মোট: ৳' + t;
    }

    window.delCart = i => { cart.splice(i, 1); updCart(); openCart(); };

    document.getElementById('cartIcon').onclick = openCart;
    document.getElementById('bCart').onclick = openCart;

    document.getElementById('checkout').onclick = () => {
        if(!cart.length) return alert('আপনার কার্ট খালি!');
        document.getElementById('cModal').style.display = 'none';
        document.getElementById('chModal').style.display = 'flex';
    };

    document.getElementById('placeOrder').onclick = () => {
        const name = document.getElementById('cName').value;
        const phone = document.getElementById('cPhone').value;
        const addr = document.getElementById('cAddr').value;
        if(!name || !phone || !addr) return alert('সকল তথ্য দিন!');

        const orders = JSON.parse(localStorage.getItem('kinzaOrders') || '[]');
        orders.push({
            name, phone, addr, items: cart, 
            total: cart.reduce((a, b) => a + Number(b.price), 0),
            date: new Date().toLocaleString()
        });
        localStorage.setItem('kinzaOrders', JSON.stringify(orders));

        alert('আপনার অর্ডার সফলভাবে গৃহীত হয়েছে!');
        cart = [];
        updCart();
        document.getElementById('chModal').style.display = 'none';
    };
</script>
</body>
</html>
